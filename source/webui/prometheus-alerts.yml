# Example Prometheus alert rules for ntpdir.  Copy this file next to prometheus.yml, list it under rule_files:, and adjust the
# thresholds.  The first rule expects the scrape job to be called "ntpdir"; change that name to match yours.
groups:
  - name: ntpdir
    rules:
      - alert: NtpdirNodeDown
        expr: up{job="ntpdir"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} cannot be scraped"
      - alert: NtpdirChronyNotRunning
        expr: ntpdir_chrony_running == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}: chrony is not running"
      - alert: NtpdirNotSynchronised
        expr: ntpdir_chrony_synchronised == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}: the clock is not synchronised"
      - alert: NtpdirClockOffset
        expr: abs(ntpdir_chrony_offset_ms) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: the clock is more than 100 ms off"
      - alert: NtpdirHighStratum
        expr: ntpdir_chrony_stratum >= 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: stratum {{ $value }}"
      - alert: NtpdirNoReachableSource
        expr: sum by (instance) (ntpdir_chrony_source_reach) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}: chrony has not heard from any source"
      - alert: NtpdirNoActiveGateway
        expr: sum by (group, af) (ntpdir_gateway_active) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "No node is the active gateway of group {{ $labels.group }} ({{ $labels.af }})"
      - alert: NtpdirGatewayNotListening
        expr: ntpdir_gateway_ntp_listening == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: the NTP listener of group {{ $labels.group }} is down"
      - alert: NtpdirUpstreamDown
        expr: ntpdir_upstream_healthy == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: upstream server {{ $labels.server }} is down"
      - alert: NtpdirFalseticker
        expr: ntpdir_upstream_falseticker == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: upstream server {{ $labels.server }} disagrees with the others"
      - alert: NtpdirCertificateExpiresSoon
        expr: ntpdir_certificate_expires_in_seconds < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: the {{ $labels.certificate }} certificate expires in less than 14 days"
      - alert: NtpdirCertificateExpiresVerySoon
        expr: ntpdir_certificate_expires_in_seconds < 3 * 86400
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}: the {{ $labels.certificate }} certificate expires in less than 3 days"
      - alert: NtpdirHostCPU
        expr: ntpdir_host_cpu_percent > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: CPU above 90% for 15 minutes"
      - alert: NtpdirHostMemory
        expr: ntpdir_host_memory_used_bytes / ntpdir_host_memory_total_bytes > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: more than 90% of the memory is in use"
      - alert: NtpdirFilesystemFull
        expr: ntpdir_host_filesystem_used_percent > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.mount }} is more than 90% full"
